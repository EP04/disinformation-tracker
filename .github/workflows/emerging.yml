name: Emerging Terms

on:
  schedule:
    - cron: '0 1 * * *'   # 1am UTC — one hour after the midnight-UTC Reddit job
  workflow_dispatch:        # manual trigger so you can test it now

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas gspread google-auth google-auth-oauthlib

      - name: Write credentials.json from secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Write token.json from secret
        run: echo '${{ secrets.GOOGLE_TOKEN }}' > token.json

      - name: Run emerging-terms analysis
        run: python emerging_terms.py

      - name: Save outputs back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add emerging_terms_latest.csv emerging_terms_history.csv emerging_terms_by_author.csv || true
          git diff --staged --quiet || git commit -m "update emerging terms [skip ci]"
          git push