name: Test Google Alerts Access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser
      - run: |
          python -c "import feedparser; f=feedparser.parse('https://www.google.com.au/alerts/feeds/09388527107749816884/5903418040278885156'); print('status:', f.get('status')); print('entries:', len(f.entries))"